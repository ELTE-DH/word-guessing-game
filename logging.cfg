version: 1
formatters:
  dateinisoformat:
    '()': main.ISOFormatter
    format: '%(asctime)s\t%(name)s\t%(levelname)s\t%(message)s'
    datefmt: '%Y-%m-%dT%H:%M:%S.%f'
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: dateinisoformat
    stream: ext://sys.stderr
  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: dateinisoformat
    filename: game.log
loggers:
  console:
    level: DEBUG
    handlers: [console]
    propagate: no
  file:
    level: DEBUG
    handlers: [file]
    propagate: no
root:
  level: DEBUG
  handlers: [console,file]
